<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Pieteikšanās</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <h2 style="text-align: center;">Pieteikties sistēmā</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="errors">
              {% for message in messages %}<p>{{ message }}</p>{% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Lietotājvārds:</label>
                <input type="text" name="username" required placeholder="Ievadiet savu vārdu">
            </div>
            <div class="form-group">
                <label>Parole:</label>
                <input type="password" name="password" required placeholder="Ievadiet paroli">
            </div>
            <button type="submit" class="btn btn-add" style="width: 100%; background: var(--accent);">Ieiet portālā</button>
        </form>
        <p style="text-align: center; margin-top: 20px;">
            Nav konta? <a href="/register" style="color: var(--accent);">Izveidot jaunu</a>
        </p>
    </div>
</body>
</html>
